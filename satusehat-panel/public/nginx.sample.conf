# =============================================================
# SATUSEHAT Admin Panel — Nginx sample
#
# Two supported deployments:
#
#  A) SITE OWN (server_name ip  /  normal site) with the panel as a
#     SUB-FOLDER  http://ip/satusehat-panel/
#       Drop the WHOLE satusehat-panel/ folder into your webroot
#       (or symlink it), then add the `location ^~ /satusehat-panel/`
#       block below to the site's existing server block.
#       SCRIPT_NAME auto-detection (config/base_path.php) handles the
#       prefix — no .env edits needed.
#
#  B) PANEL OWN server block:  DocumentRoot → satusehat-panel/public
#       (the panel owns the host / subdomain).
#
# The panel is a small PHP SPA:
#   - /api/*          -> public/index.php  (PHP JSON API)
#   - / (ui)          -> public/shell.php  (renders window.PANEL_BASE)
#   - css/js/fonts etc. served statically from public/
# =============================================================

# -------------------------------------------------------------
# (A) SUB-PATH inside an existing server block  (RECOMMENDED)
#     Add `include /path/to/satusehat-panel/public/nginx.subpath.conf;`
#     or paste this into your existing `server { ... }`.
# -------------------------------------------------------------

