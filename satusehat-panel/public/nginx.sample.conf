# -------------------------------------------------------------
# NOTE on routing prefixes
# -------------------------------------------------------------
# The panel detects its sub-folder from SCRIPT_NAME and strips it in the
# Router + front-controller auth check. In (A), the request arrives as
# /satusehat-panel/api/... ; SCRIPT_NAME=/satusehat-panel/index.php →
# panel base /satusehat-panel. In (B) it's '/'. Both work out of the box.
#
# CSRF/state-changing POSTs are behind the SameSite=Lax HttpOnly session;
# the panel ships no CSRF token yet (see AuthController). Protect SEND
# behind a trusted network / basic auth at the Nginx layer if exposed wide.