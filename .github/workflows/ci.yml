name: CI

on:
  push:
    paths:
      - 'satusehat-panel/**'
      - 'php-service/lib/satusehat/**'
      - 'php-service/lib/Logger.php'
  pull_request:

jobs:
  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satusehat-panel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: bash scripts/ci.sh
